name: Release

# Builds versioned Windows and macOS packages with checksums, publishes them as a GitHub Release in
# the public releases repository (ContextSnap-Releases), verifies that the public
# download URLs serve the exact files, and opens a pull request that updates website/downloads.json.
# Binaries are never committed to this repository. Setup: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example 1.0.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Public repository that hosts the release assets. Override with the RELEASES_REPO repository variable.
  RELEASES_REPO: ${{ vars.RELEASES_REPO || format('{0}/ContextSnap-Releases', github.repository_owner) }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          v="${RAW_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version '$RAW_VERSION' (expected 1.2.3 or 1.2.3-beta.1)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
        env:
          CI: "true"
      - run: dotnet publish src/ContextSnap -c Release -p:Version=${{ env.VERSION }} -o publish/ContextSnap
      - name: Package
        shell: pwsh
        run: |
          $zip = "ContextSnap-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path publish/ContextSnap/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ContextSnap-*-windows-x64.zip*

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      notarized: ${{ steps.signing.outputs.notarized }}
    steps:
      - uses: actions/checkout@v5
      - run: swift test
        working-directory: macos
      # Optional Developer ID signing and notarization (docs/RELEASING.md). Without the secrets the app is
      # ad-hoc signed and the website tells macOS users how to open it.
      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::warning::No Developer ID certificate configured; the macOS app is ad-hoc signed and not notarized."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "::error::MACOS_CERTIFICATE_P12 contains no Developer ID Application identity."; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" && -n "$NOTARY_KEY" ]]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Developer ID signing without notarization: set NOTARY_KEY_ID, NOTARY_ISSUER_ID, and NOTARY_KEY."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - run: ./scripts/build.sh "$VERSION"
        working-directory: macos
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      - name: Checksums
        working-directory: macos/dist
        run: for f in ContextSnap-*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/dist/ContextSnap-*
      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

  publish:
    needs: [version, windows, macos]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update the public release
        env:
          # Fine-grained token limited to the releases repository with Contents: read and write.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Secret RELEASES_TOKEN is not set. See docs/RELEASING.md."; exit 1; }
          files=(artifacts/windows/* artifacts/macos/*)
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --repo "$RELEASES_REPO" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --repo "$RELEASES_REPO" --title "ContextSnap $VERSION" \
              --notes "Windows: framework-dependent build (requires the .NET 10 Desktop Runtime), not code-signed. macOS: universal build, ad-hoc signed and not notarized. Verify downloads with the .sha256 files."
          fi
      - name: Verify public downloads
        run: |
          # Anonymous downloads (no token) prove the assets are public; checksums prove they are these files.
          for f in "ContextSnap-$VERSION-windows-x64.zip" "ContextSnap-$VERSION-macos-universal.dmg"; do
            local_file=$(ls artifacts/*/"$f")
            url="https://github.com/$RELEASES_REPO/releases/download/v$VERSION/$f"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "/tmp/$f" "$url"
            [[ "$(sha256sum < "/tmp/$f")" == "$(sha256sum < "$local_file")" ]] || { echo "::error::Checksum mismatch for $url"; exit 1; }
            echo "Verified $url"
          done

  update-website:
    needs: [version, macos, publish]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update downloads.json
        env:
          MACOS_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const v = process.env.VERSION, base = `https://github.com/${process.env.RELEASES_REPO}/releases/download/v${v}/`;
            const info = (dir, f) => { const b = fs.readFileSync(path.join("artifacts", dir, f)); return { file: base + f, size: (b.length / 1048576).toFixed(1) + " MB", sha256: crypto.createHash("sha256").update(b).digest("hex") }; };
            const m = JSON.parse(fs.readFileSync("website/downloads.json"));
            m.version = v;
            Object.assign(m.platforms.windows, info("windows", `ContextSnap-${v}-windows-x64.zip`));
            Object.assign(m.platforms.macos, info("macos", `ContextSnap-${v}-macos-universal.dmg`));
            // Builds without Apple notarization need one extra confirmation on first launch.
            if (process.env.MACOS_NOTARIZED === "true") delete m.platforms.macos.note;
            else m.platforms.macos.note = "Not notarized by Apple yet. The first time you open it, click Done, then go to System Settings → Privacy & Security and click Open Anyway.";
            fs.writeFileSync("website/downloads.json", JSON.stringify(m, null, 2) + "\n");'
          git diff --stat
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "website/downloads.json already points to $VERSION."
            exit 0
          fi
          branch="release/v$VERSION-downloads"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Point website downloads to ContextSnap $VERSION"
          # The branch only ever holds this generated commit, so a re-run replaces it.
          git push --force -u origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Pull request for $branch already open; branch updated."
            exit 0
          fi
          gh pr create --base "$BASE" --head "$branch" --title "Website downloads: ContextSnap $VERSION" \
            --body "Updates website/downloads.json to the public assets of v$VERSION in $RELEASES_REPO. The release workflow downloaded each asset anonymously and matched its SHA-256 before opening this PR. Merging deploys the website." \
            || echo "::warning::Could not open the pull request (allow GitHub Actions to create pull requests in Settings → Actions → General). Branch $branch is pushed."

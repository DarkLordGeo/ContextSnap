name: Release

# Builds the Snapctx Windows installer and Linux package with checksums, publishes them as a GitHub Release
# in the public releases repository (ContextSnap-Releases, named before the rename), verifies that the public
# download URLs serve the exact files, and opens a pull request that updates website/downloads.json.
# Binaries are never committed to this repository. Setup: docs/RELEASING.md.
# The macOS app (macos/) is built and tested by CI but not released until it can be notarized.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example 1.0.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Public repository that hosts the release assets. Override with the RELEASES_REPO repository variable.
  RELEASES_REPO: ${{ vars.RELEASES_REPO || format('{0}/ContextSnap-Releases', github.repository_owner) }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          v="${RAW_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version '$RAW_VERSION' (expected 1.2.3 or 1.2.3-beta.1)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
        env:
          CI: "true"
      # Self-contained: the installer carries the .NET runtime, so users install nothing else.
      - run: dotnet publish src/ContextSnap -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish/installer-app
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DAppVersion=$env:VERSION" installer/Snapctx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "publish/Snapctx-Setup.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  Snapctx-Setup.exe" | Out-File "$setup.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/Snapctx-Setup.exe*

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install X11 test tools
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xclip
      - run: xvfb-run -a dotnet test tests/ContextSnap.Linux.Tests -c Release
        env:
          CI: "true"
      # Self-contained single file: users need no .NET runtime.
      - run: >-
          dotnet publish src/ContextSnap.Linux -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o publish/linux
      - name: Smoke test
        run: |
          [[ "$(publish/linux/snapctx --version)" == "Snapctx $VERSION" ]]
          publish/linux/snapctx --print | grep -q "^# Context Snapshot"
      - name: Package
        run: |
          dir="snapctx-$VERSION-linux-x64"
          mkdir "$dir"
          cp publish/linux/snapctx LICENSE "$dir/"
          tar -czf "Snapctx-$VERSION-linux-x64.tar.gz" "$dir"
          sha256sum "Snapctx-$VERSION-linux-x64.tar.gz" > "Snapctx-$VERSION-linux-x64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Snapctx-*-linux-x64.tar.gz*

  publish:
    needs: [version, windows, linux]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update the public release
        env:
          # Fine-grained token limited to the releases repository with Contents: read and write.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Secret RELEASES_TOKEN is not set. See docs/RELEASING.md."; exit 1; }
          files=(artifacts/windows/* artifacts/linux/*)
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --repo "$RELEASES_REPO" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --repo "$RELEASES_REPO" --title "Snapctx $VERSION" \
              --notes "Windows: Snapctx-Setup.exe, a per-user x64 installer that includes the .NET runtime. It is not code-signed, so SmartScreen may warn on first run. Linux: self-contained x64 command-line app (needs wl-clipboard or xclip; wmctrl to list windows). Verify downloads with the .sha256 files."
          fi
      - name: Verify public downloads
        run: |
          # Anonymous downloads (no token) prove the assets are public; checksums prove they are these files.
          for f in "Snapctx-Setup.exe" "Snapctx-$VERSION-linux-x64.tar.gz"; do
            local_file=$(ls artifacts/*/"$f")
            url="https://github.com/$RELEASES_REPO/releases/download/v$VERSION/$f"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "/tmp/$f" "$url"
            [[ "$(sha256sum < "/tmp/$f")" == "$(sha256sum < "$local_file")" ]] || { echo "::error::Checksum mismatch for $url"; exit 1; }
            echo "Verified $url"
          done

  update-website:
    needs: [version, publish]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update downloads.json
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const v = process.env.VERSION, base = `https://github.com/${process.env.RELEASES_REPO}/releases/download/v${v}/`;
            const info = (dir, f) => { const b = fs.readFileSync(path.join("artifacts", dir, f)); return { file: base + f, size: (b.length / 1048576).toFixed(1) + " MB", sha256: crypto.createHash("sha256").update(b).digest("hex") }; };
            const m = JSON.parse(fs.readFileSync("website/downloads.json"));
            m.version = v;
            Object.assign(m.platforms.windows, { detail: "Windows 10/11, 64-bit installer · everything included, no .NET install needed" }, info("windows", "Snapctx-Setup.exe"));
            m.platforms.linux = Object.assign(m.platforms.linux || { label: "Linux" }, info("linux", `Snapctx-${v}-linux-x64.tar.gz`));
            fs.writeFileSync("website/downloads.json", JSON.stringify(m, null, 2) + "\n");'
          git diff --stat
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "website/downloads.json already points to $VERSION."
            exit 0
          fi
          branch="release/v$VERSION-downloads"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Point website downloads to Snapctx $VERSION"
          # The branch only ever holds this generated commit, so a re-run replaces it.
          git push --force -u origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Pull request for $branch already open; branch updated."
            exit 0
          fi
          gh pr create --base "$BASE" --head "$branch" --title "Website downloads: Snapctx $VERSION" \
            --body "Updates website/downloads.json to the public assets of v$VERSION in $RELEASES_REPO. The release workflow downloaded each asset anonymously and matched its SHA-256 before opening this PR. Merging deploys the website." \
            || echo "::warning::Could not open the pull request (allow GitHub Actions to create pull requests in Settings → Actions → General). Branch $branch is pushed."

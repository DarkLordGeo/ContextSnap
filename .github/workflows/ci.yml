name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: CI only builds and tests, including for pull requests from forks.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
        env:
          CI: "true"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test
        working-directory: macos
      - run: ./scripts/build.sh 0.0.0-ci
        working-directory: macos
